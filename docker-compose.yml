# docker-compose.yml  (Vite + React only - no backend, no database)
#
# DEV   : docker compose --profile dev up
# BUILD : docker compose --profile build run --rm react-build      <- use this in GitHub Actions
# PROD  : docker compose --profile prod up                         <- builds, then serves with nginx
#
# Dev server:  http://localhost:5173
# Prod server: http://localhost:8080
# Build output goes to ./dist

services:

  # ---------- DEVELOPMENT (hot reload) ----------
  react-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true

  # ---------- BUILD (creates static files in ./dist) ----------
  react-build:
    profiles: ["build", "prod"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - build_node_modules:/app/node_modules
    environment:
      - CI=true
    command: sh -c "npm ci && npm run build"

  # ---------- PRODUCTION (serve ./dist with nginx) ----------
  react-prod:
    profiles: ["prod"]
    image: nginx:alpine
    depends_on:
      react-build:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    configs:
      - source: nginx_spa
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

configs:
  # Makes React Router routes work on page refresh
  nginx_spa:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        location / {
          try_files $$uri /index.html;
        }
      }

volumes:
  dev_node_modules:
  build_node_modules: