name: React CI/CD - Staging

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enable this after ESLint is configured in package.json
      # - name: Lint
      #   run: npm run lint

      - name: Build
        env:
          FIGMA_PUBLIC_URL: ${{ vars.FIGMA_PUBLIC_URL }}
        run: npm run build

      - name: Check build output
        run: |
          echo "Build files:"
          find dist -type f

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist/

      - name: Deploy to cPanel Staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp
          server-dir: /domains/codeinq.com/public_html/paciano/design/tmp_1/
          local-dir: ./dist/
          dangerous-clean-slate: false